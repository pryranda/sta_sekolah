<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STA Sekolah — Panel Web Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- LOGIN VIEW -->
  <div id="login-view" class="login-page hidden">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-badge">STA</div>
        <div>
          <h1>Panel Web Admin</h1>
          <p>Kelola data sekolah, upload siswa massal, jadwal, dan SPP</p>
        </div>
      </div>

      <form id="login-form" class="form-stack">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input id="login-username" type="text" placeholder="admin.sekolah" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="Masukkan password" autocomplete="current-password" required />
        </div>

        <details class="api-settings">
          <summary>Pengaturan Server API</summary>
          <div class="form-group" style="margin-top: 10px;">
            <label for="login-api-url">Base URL API</label>
            <input id="login-api-url" type="url" placeholder="http://10.0.0.39:5001/api" />
            <small class="hint">Kosongkan / klik reset untuk memakai server bawaan.</small>
          </div>
        </details>

        <div id="login-error" class="alert alert-error hidden"></div>

        <button id="login-submit" type="submit" class="btn btn-primary btn-block">
          Masuk ke Panel Admin
        </button>
      </form>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="app-shell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo-wrap">
          <img id="sidebar-logo" class="sidebar-logo hidden" alt="Logo Sekolah" />
          <div id="sidebar-logo-fallback" class="brand-badge">STA</div>
        </div>
        <div class="sidebar-title-wrap">
          <div id="sidebar-school-name" class="sidebar-school">STA Sekolah</div>
          <div id="sidebar-user-role" class="sidebar-role">Administrator</div>
        </div>
        <button id="sidebar-close" class="icon-btn mobile-only" aria-label="Tutup menu">&times;</button>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div id="user-avatar" class="user-avatar">A</div>
          <div class="user-meta">
            <div id="user-name" class="user-name">Admin</div>
            <div id="user-username" class="user-sub">-</div>
          </div>
        </div>
        <div class="sidebar-footer-actions">
          <button id="btn-change-pw" class="btn btn-ghost btn-sm" title="Ubah Password">Ubah Password</button>
          <button id="btn-logout" class="btn btn-danger-soft btn-sm">Keluar</button>
        </div>
      </div>
    </aside>

    <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

    <div class="main-wrap">
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebar-open" class="icon-btn mobile-only" aria-label="Buka menu">&#9776;</button>
          <div>
            <h2 id="page-title" class="page-title">Dashboard</h2>
            <p id="page-subtitle" class="page-subtitle">Ringkasan data sekolah</p>
          </div>
        </div>
        <div class="topbar-right">
          <span id="api-badge" class="api-badge" title="Server API aktif">API: -</span>
        </div>
      </header>

      <main id="main-content" class="main-content"></main>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal-root" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="modal-box" class="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button id="modal-close" class="icon-btn" aria-label="Tutup">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast-root" class="toast-root"></div>

  <script src="api.js"></script>
  <script src="csv.js"></script>
  <script src="views-data.js"></script>
  <script src="views-ops.js"></script>
  <script src="app.js"></script>
</body>
</html>
